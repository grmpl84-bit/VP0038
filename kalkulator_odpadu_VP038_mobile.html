<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator odpadu VP038</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;min-height:100vh;padding:32px 16px;color:#1a1a2e}
.card{background:#ffffff;border-radius:16px;border:2px solid #111827;box-shadow:0 4px 24px rgba(0,0,0,.1);padding:36px 40px;max-width:760px;margin:auto}
h1{font-size:1.9rem;margin-bottom:6px}
.subtitle{color:#888;margin-bottom:28px}
.field{margin-bottom:18px}
label{display:block;font-size:1.2rem;font-weight:700;color:#444;margin-bottom:6px;text-transform:uppercase}
select,input{width:100%;padding:11px 14px;border:1.5px solid #d1d5db;border-radius:10px;font-size:1.15rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.radio{display:flex;gap:20px;margin-top:8px}
.radio label{display:flex;gap:6px;align-items:center;text-transform:none;font-size:.95rem}
button{width:100%;padding:16px;border:0;border-radius:10px;font-size:1.2rem;font-weight:700;cursor:pointer;margin-top:8px}
.btn{background:#111827;color:white}
.btn:hover{background:#000000}
.reset{background:white;border:1.5px solid #d1d5db;color:#666}
table{width:100%;border-collapse:collapse;margin-top:25px;font-size:1.05rem}
th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}
th{background:#111827;color:#ffffff}
.result{margin-top:28px;background:#f5f3ff;border:1px solid #c4b5fd;border-radius:12px;padding:20px}
.hidden{display:none}
.summary{margin-top:15px;padding:15px;background:white;border-radius:10px}
.small-btn{width:auto;padding:7px 12px;font-size:.8rem;background:#fee2e2;color:#991b1b}

@media (max-width: 600px){
  body{
    padding:12px;
    font-size:18px;
  }

  .card{
    padding:22px 16px;
    border-radius:12px;
  }

  h1{
    font-size:1.7rem;
  }

  .row{
    grid-template-columns:1fr;
    gap:10px;
  }

  input, select{
    min-height:52px;
    font-size:1.15rem;
  }

  button{
    min-height:54px;
    font-size:1.15rem;
  }

  table{
    display:block;
    overflow-x:auto;
    white-space:nowrap;
  }

  th, td{
    padding:12px 10px;
    font-size:1rem;
  }
}

</style>
</head>
<body>
<div class="card">
<h1>🗑️ Kalkulator Odpadu</h1>


<div class="row">
<div class="field">
<label>Rodzaj worka</label>
<select id="bag">
<option value="6.854">309.522.5 — 685,4 g / 100 szt.</option>
<option value="8.023">646.125.3 — 802,3 g / 100 szt.</option>
<option value="7.840">391.354.6 — 784,0 g / 100 szt.</option>
<option value="6.900">169.761.1 — 690,0 g / 100 szt.</option>
</select>
</div>

<div class="field">
<label>Waga brutto pojemnika (g)</label>
<input id="weight" type="number" min="0" placeholder="np. 15420">
</div>
</div>

<div class="field">
<label>Rodzaj wady</label>
<div class="radio">
<label><input type="radio" name="defect" value="Wada producenta" checked> Wada producenta</label>
<label><input type="radio" name="defect" value="Wada BPL"> Wada BPL</label>
</div>
</div>

<p style="margin-bottom:15px;color:#92400e;background:#fefce8;padding:12px;border-radius:10px">
⚖️ Automatycznie odejmowana waga pustego pojemnika: <b>2771 g</b>
</p>

<button class="btn" onclick="addContainer()">+ Dodaj pojemnik</button>
<button class="reset" onclick="clearData()">Wyczyść raport</button>

<h2 style="margin-top:30px">Pomiary</h2>
<table>
<thead>
<tr><th>Worek</th><th>Wada</th><th>Waga brutto (g)</th><th>Ilość szt.</th><th></th></tr>
</thead>
<tbody id="list"></tbody>
</table>

<button class="btn" onclick="showReport()">Generuj raport</button>

<div id="report" class="result hidden"></div>
</div>

<script>
const CONTAINER_WEIGHT = 2771;
let records = JSON.parse(localStorage.getItem("odpady")) || [];

function addContainer(){
 const bag=document.getElementById("bag");
 const gross=Number(document.getElementById("weight").value);
 if(!gross || gross<=0){alert("Podaj wagę pojemnika.");return;}
 const defect=document.querySelector('input[name="defect"]:checked').value;
 const bagWeight=Number(bag.value);
 const bagName=bag.options[bag.selectedIndex].text.split(" — ")[0];

 const net=gross-CONTAINER_WEIGHT;
 const pieces=net>0 ? Math.ceil(net/bagWeight) : 0;

 records.push({bag:bagName,defect,pieces,gross});
 localStorage.setItem("odpady",JSON.stringify(records));
 document.getElementById("weight").value="";
 render();
}

function render(){
 const tbody=document.getElementById("list");
 tbody.innerHTML="";
 records.forEach((r,i)=>{
  tbody.innerHTML+=`<tr>
  <td>${r.bag}</td>
  <td>${r.defect}</td>
  <td>${r.gross} g</td>
  <td>${r.pieces}</td>
  <td><button class="small-btn" onclick="removeRecord(${i})">Usuń</button></td>
  </tr>`;
 });
}

function removeRecord(i){
 records.splice(i,1);
 localStorage.setItem("odpady",JSON.stringify(records));
 render();
}

function clearData(){
 if(confirm("Usunąć wszystkie pomiary?")){
  records=[];
  localStorage.removeItem("odpady");
  render();
  document.getElementById("report").classList.add("hidden");
 }
}

function showReport(){
 let groups={};
 records.forEach(r=>{
  if(!groups[r.bag]) groups[r.bag]={"Wada producenta":0,"Wada BPL":0};
  groups[r.bag][r.defect]+=r.pieces;
 });

 let html="<h2>📊 Raport odpadu</h2>";
 Object.keys(groups).forEach(b=>{
  html+=`<div class="summary"><b>${b}</b><br>
  Wada producenta: ${groups[b]["Wada producenta"]} szt.<br>
  Wada BPL: ${groups[b]["Wada BPL"]} szt.<br>
  Razem: ${groups[b]["Wada producenta"]+groups[b]["Wada BPL"]} szt.</div>`;
 });
 if(!records.length) html+="Brak danych.";
 const report=document.getElementById("report");
 report.innerHTML=html;
 report.classList.remove("hidden");
}

render();
</script>
</body>
</html>
